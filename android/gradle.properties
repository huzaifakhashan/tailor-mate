org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental "Build Tools API" compiler crashes when the project
# and the Gradle/pub caches live on different Windows drive letters
# (relative-path computation across drive roots throws). Disabling
# incremental compilation avoids that crash.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Pinned to AGP 8.x (see settings.gradle.kts): some plugins
# (flutter_plugin_android_lifecycle) don't yet support AGP 9's built-in
# Kotlin model, so this must stay false to use the legacy Kotlin plugin path.
android.builtInKotlin=false
# AGP 8.x / Gradle 8.10 don't support the Java 25 JBR bundled with the
# latest Android Studio, so point this project's build at a separate
# Java 21 JDK instead (installed via Eclipse Temurin, not the system default).
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.8-hotspot
